<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Parquímetro</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="container">
<section class="card">
<h1>Simulador de Parquímetro</h1>
<p>Informe o valor para calcular o tempo de estacionamento e o troco.</p>
<form id="formParquimetro">
<label for="valor">Valor pago</label>
<input id="valor" name="valor" type="number" min="0" step="0.01" placeholder="Ex.: 2,00">
<button type="submit">Calcular</button>
</form>
<div id="resultado" class="resultado" aria-live="polite"></div>
</section>
</main>
<script type="module" src="./js/app.js"></script>
</body>
</html>
